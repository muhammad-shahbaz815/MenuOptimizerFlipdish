# Deploy to Cloudflare Workers (environment: production — configure there, not only repo-level).
# GitHub production environment secrets/variables are owned by Platform Enablement Team (#ask-platform-enablement-team).
# Environment secrets: CLOUDFLARE_API_TOKEN, GOOGLE_CLIENT_SECRET, NEXTAUTH_SECRET
# Environment variables: CLOUDFLARE_ACCOUNT_ID, GOOGLE_CLIENT_ID, NEXTAUTH_URL (public URL, no trailing slash)

name: Deploy to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: main

permissions:
  id-token: write
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
      NEXTAUTH_URL: ${{ vars.NEXTAUTH_URL }}

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Apply DB schema
        run: npm run db:schema:prod

      - name: Run DB migrations
        run: npm run db:migrate:prod

      - name: Set Worker secrets & vars
        run: npm run worker-secrets:prod

      - name: Build and deploy
        run: npm run deploy

  github-release-and-notification:
    runs-on: ubuntu-latest
    environment: production
    needs:
      - deploy
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - name: GitHub Release and Notification
        uses: flipdishbytes/github-release-slack-notification@v1.1
        with:
          projectName: Cloudflare App Template
          sendSlackNotification: false
          slackChannel: production_releases
        continue-on-error: true
